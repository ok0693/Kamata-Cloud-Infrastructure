name: Generate API Types

on:
  push:
    # mainブランチ以外へのプッシュで発火
    branches-ignore:
      - main
    # 無限ループや無駄な実行を防ぐため、OpenAPI定義かこのWorkflow自体が変更された時のみ実行
    paths:
      - "docs/openapi/**"
      - ".github/workflows/create-types.yml"
  workflow_dispatch:
  
permissions:
  contents: write # 生成したコードをリポジトリへプッシュするために必要

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "srcs/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./srcs
        run: |
          pnpm install --frozen-lockfile

      # 【修正1】ディレクトリの存在保証とデバッグ情報の表示
      - name: Bundle API Docs
        run: |
          echo "Current directory: $(pwd)"
          ls -R docs/ # docsの中身を確認
          
          # publicディレクトリが無ければ作る
          mkdir -p public
          
          # バンドル実行
          pnpm --package=@redocly/cli dlx redocly bundle docs/openapi/openapi.yml -o public/api.yml
          
          # 【重要】生成されたファイルの中身をログに出す（空ならここで判明する）
          echo "--- Generated api.yml content ---"
          cat public/api.yml
          echo "---------------------------------"

      - name: Generate Types
        working-directory: ./srcs
        run: |
          # ../public/api.yml の存在確認（念の為）
          ls -la ../public/api.yml
          
          pnpm openapi-typescript --root-types --root-types-no-schema-prefix ../public/api.yml --output ./shared/types/api-types.ts

      - name: Commit and Push Generated Types
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./shared/types/api-types.ts
          git commit -m 'Generate types from OpenAPI spec' || echo "No changes to commit"
          echo "Pushing changes to branch ${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}